name: Build mcontain

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover Minecraft versions
        id: discover
        run: python3 .github/scripts/discover_versions.py > versions.json
      - name: Set build matrix
        id: set-matrix
        run: |
          echo "versions=$(jq -c '.versions' versions.json)" >> "$GITHUB_OUTPUT"
      - name: Upload version list
        uses: actions/upload-artifact@v4
        with:
          name: versions
          path: versions.json
          if-no-files-found: error

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -x test \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pjava_release=${{ matrix.java_release }} \
            -Pminecraft_range=${{ matrix.range }}
      - name: Rename jar
        run: |
          set -euo pipefail
          jar=$(find build/libs -maxdepth 1 -name 'mcontain-*.jar' ! -name '*-sources.jar' | head -n1)
          mkdir -p out
          mv "$jar" "out/${{ matrix.jar }}"
          ls -la out
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.jar }}
          path: out/${{ matrix.jar }}
          if-no-files-found: error

  update-readme:
    needs: discover
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Restore version list
        uses: actions/download-artifact@v4
        with:
          name: versions
          path: .
      - name: Regenerate README table
        run: python3 .github/scripts/gen_readme.py versions.json
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "mcontain-bot"
            git config user.email "komixkat@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update supported versions table"
            git push
          else
            echo "README up to date"
          fi

  release:
    needs: [ build, discover ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: mcontain-*
      - name: List jars
        run: find dist -maxdepth 1 -type f -name '*.jar' -exec echo '{}' \; | sort
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.jar --generate-notes

  release-auto:
    needs: [ build, discover ]
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: mcontain-*
      - name: List jars
        run: find dist -maxdepth 1 -type f -name '*.jar' -exec echo '{}' \; | sort
      - name: Get current release assets
        id: current
        run: |
          assets=$(gh release view v4 --json assets --jq '.assets[].name' 2>/dev/null || echo "")
          echo "assets<<EOF" >> "$GITHUB_OUTPUT"
          echo "$assets" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: Check if release needs update
        id: check
        run: |
          current_assets="${{ steps.current.outputs.assets }}"
          new_assets=$(find dist -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort)
          if [ "$current_assets" = "$new_assets" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release v4 is up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Release v4 needs update"
            echo "Current: $current_assets"
            echo "New:     $new_assets"
          fi
      - name: Update v4 release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v4 --yes 2>/dev/null || true
          gh release create v4 dist/*.jar --generate-notes